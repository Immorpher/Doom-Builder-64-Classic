/*******************************************************************\
	Doom Builder Script highlighting definitions for Doom64 MAPINFO
\*******************************************************************/

// Editor settings
description = "Doom64 MAPINFO";
codepage = 0;
extensions = "txt";
casesensitive = false;
insertcase = 0;				// 0=Normal, 1=Lowercase, 2=Uppercase
lexer = 35;
functionopen = "(";
functionclose = ")";
argumentdelimiter = ",";
terminator = "";
keywordhelp = "";

keywords
{
	map = "map MAPxx NAME { ... }  Map definition";
	cluster = "cluster n { ... } or cluster = n  Cluster definition, or the cluster of a map";
	levelnum = "levelnum = number  Level number";
	music = "music = LUMPNAME  Music lump";
	classtype = "classtype = number  Map class type";
	exitdelay = "exitdelay = tics  Delay before exiting the map";
	clearcheats = "clearcheats  Disable cheats that were active";
	compat_collision = "compat_collision  Use compatible collision";
	nointermission = "nointermission  Skip the intermission screen";
	continuemusiconexit = "continuemusiconexit  Keep the music playing after exiting";
	forcegodmode = "forcegodmode  Force god mode in this map";
	pic = "pic = LUMPNAME  Background picture";
	pic_x = "pic_x = number  Picture X position";
	pic_y = "pic_y = number  Picture Y position";
	entertext = "entertext = text  Text shown when entering the cluster";
	exittext = "exittext = text  Text shown when exiting the cluster";
	scrolltextend = "scrolltextend  Scroll the text at the end";
}

constants
{
}
