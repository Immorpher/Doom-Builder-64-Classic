/*******************************************************************\
	Doom Builder Script highlighting definitions for Doom64 SKYDEFS
\*******************************************************************/

// Editor settings
description = "Doom64 SKYDEFS";
codepage = 0;
extensions = "txt";
casesensitive = false;
insertcase = 0;				// 0=Normal, 1=Lowercase, 2=Uppercase
lexer = 35;
functionopen = "(";
functionclose = ")";
argumentdelimiter = ",";
terminator = "";
keywordhelp = "";
constantsasliterals = true;	// the hexadecimal values below are shown like numbers

keywords
{
	sky = "sky F_SKYx { ... }  Sky definition";
	pic = "pic = LUMPNAME  Sky picture";
	backpic = "backpic = LUMPNAME  Background picture behind the sky";
	fogcolor = "fogcolor = r g b  Fog color (hexadecimal)";
	basecolor = "basecolor = r g b  Base color (hexadecimal)";
	highcolor = "highcolor = r g b  Top gradient color (hexadecimal)";
	lowcolor = "lowcolor = r g b  Bottom gradient color (hexadecimal)";
	cloud = "cloud  Cloud sky";
	thunder = "thunder  Thunder and lightning";
	fire = "fire  Fire sky";
	void = "void  Void sky";
	fadeinbackground = "fadeinbackground  Fade in the background picture";
	fogfactor = "fogfactor = number  Fog factor";
}

