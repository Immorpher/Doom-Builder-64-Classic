/*******************************************************************\
	Doom Builder Script highlighting definitions for Doom64 ANIMDEFS
\*******************************************************************/

// Editor settings
description = "Doom64 ANIMDEFS";
codepage = 0;
extensions = "txt";
casesensitive = false;
insertcase = 0;				// 0=Normal, 1=Lowercase, 2=Uppercase
lexer = 35;
functionopen = "(";
functionclose = ")";
argumentdelimiter = ",";
terminator = "";
keywordhelp = "";

keywords
{
	animpic = "animpic NAME { ... }  Animated texture or picture";
	restartdelay = "restartdelay = tics  Delay before the animation restarts";
	frames = "frames = count  Number of frames";
	speed = "speed = tics  Tics per frame";
	rewind = "rewind  Play the animation backwards after the last frame";
	cyclepalettes = "cyclepalettes  Cycle through the palettes of the frames";
}

constants
{
}
