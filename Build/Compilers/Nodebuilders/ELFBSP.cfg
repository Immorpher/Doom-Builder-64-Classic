
// Ultimate Doom Builder configuration file for ELFBSP

compilers
{
	ELFBSP
	{
		interface = "NodesCompiler";
		program = "ELFBSP.exe";
	}
}

nodebuilders
{
	ELFBSP_normal
	{
		title = "ELFBSP (Normal)";
		compiler = "ELFBSP";
		parameters = "%FI --output %FO";
	}

	ELFBSP_fast
	{
		title = "ELFBSP (Fast)";
		compiler = "ELFBSP";
		parameters = "%FI --fast --output %FO";
	}
}
